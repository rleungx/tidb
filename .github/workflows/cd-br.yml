name: BR-CD

on:
  push:
    branches: ["release-7.1-keyspace"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Image & Push To ECR
    runs-on: x64
    outputs:
      dev-image: ${{ steps.login-ecr-dev.outputs.registry }}/${{ env.ECR_REPO }}:${{ github.sha }}
      prod-image: ${{ steps.login-ecr-prod.outputs.registry }}/${{ env.ECR_REPO }}:${{ github.sha }}
    env:
      ECR_REPO: tidbcloud/serverless/br
      GITHUB_TOKEN: ${{ secrets.GIT_ACTION_BOT }}
      GCR_REPO: gcr.io/pingcap-public/serverless/br
      GCR_TAG: v7.1.0
      IS_RELEASE_BRANCH: ${{ github.ref == 'refs/heads/release-7.1-keyspace' && github.event_name == 'push' }}
    steps:
      - name: Check out Code
        uses: actions/checkout@v2

      # Setup Go with version from go.mod
      # Note: this will automatically set up go mod and build cache.
      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version-file: 'go.mod'

      # Setup private repo access in case we need to pull from tidbcloud.
      - name: Configure git for private modules
        if: env.GITHUB_TOKEN != ''
        run: git config --global url."https://${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/";

      - name: Build ARM64 BR
        env:
          GOARCH: arm64
          CGO_ENABLED: 0 # Set CGO_ENABLED=0 for cross compiling.
          CD_BR_TARGET: ./tmp/br-arm64
          GOPRIVATE: github.com/tidbcloud
          MIN_TIKV_VERSION: 6.1.0
          REGISTER_METRICS_INIT: false
        run: make build_br_cd

      - name: Build AMD64 BR
        env:
          GOARCH: amd64
          CGO_ENABLED: 0 # Set CGO_ENABLED=0 for cross compiling.
          CD_BR_TARGET: ./tmp/br-amd64
          GOPRIVATE: github.com/tidbcloud
          MIN_TIKV_VERSION: 6.1.0
          REGISTER_METRICS_INIT: false
        run: make build_br_cd

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v1
        with:
          platforms: "linux/amd64,linux/arm64"

      - name: Setup Docker Context
        run: |
          docker --context tls-env info || docker context create tls-env

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
        with:
          endpoint: tls-env

      # Setup buildx cache.
      - name: Set up buildx cache
        uses: actions/cache@v3
        with:
          path: |
            /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ hashFiles('**/Dockerfile.cd') }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Install AWS CLI
        run: |
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          unzip -q awscliv2.zip
          sudo ./aws/install --update

      # Login to ECR Dev
      - name: Login to ECR-dev
        id: login-ecr-dev
        uses: aws-actions/amazon-ecr-login@v1
        env:
          AWS_ROLE_ARN: ${{ secrets.DBAAS_DEV_AWS_ROLE }}
          AWS_REGION: us-west-2

      - name: Make Sure the Image Repos Exist - ecr dev
        env:
          AWS_ROLE_ARN: ${{ secrets.DBAAS_DEV_AWS_ROLE }}
          AWS_REGION: us-west-2
        run: |
          aws ecr describe-repositories --repository-names ${{ env.ECR_REPO }} || aws ecr create-repository --repository-name ${{ env.ECR_REPO }} || exit 1

      # Login to ECR Prod
      - name: Login to ECR-prod
        if: env.IS_RELEASE_BRANCH == 'true'
        id: login-ecr-prod
        uses: aws-actions/amazon-ecr-login@v1
        env:
          AWS_ROLE_ARN: ${{ secrets.DBAAS_PROD_AWS_ROLE }}
          AWS_REGION: us-west-2

      - name: Make Sure the Image Repos Exist - ecr prod
        if: env.IS_RELEASE_BRANCH == 'true'
        env:
          AWS_ROLE_ARN: ${{ secrets.DBAAS_PROD_AWS_ROLE }}
          AWS_REGION: us-west-2
        run: |
          aws ecr describe-repositories --repository-names ${{ env.ECR_REPO }} || aws ecr create-repository --repository-name ${{ env.ECR_REPO }} || exit 1
      

      # Login to GCR
      - name: Set up Cloud SDK
        if: env.IS_RELEASE_BRANCH == 'true'
        uses: google-github-actions/setup-gcloud@v0

      - name: Configure Gcloud
        if: env.IS_RELEASE_BRANCH == 'true'
        run: |
          gcloud auth configure-docker gcr.io --quiet
          

      # Setup Tags
      - name: Set tags conditionally
        run: |
          if [ "$IS_RELEASE_BRANCH" = "true" ]; then
            echo "TAGS=${{ steps.login-ecr-dev.outputs.registry }}/${{ env.ECR_REPO }}:${{ github.sha }},"\
            "${{ steps.login-ecr-prod.outputs.registry }}/${{ env.ECR_REPO }}:${{ github.sha }},"\
            "${{ env.GCR_REPO }}:${{ env.GCR_TAG }},"\
            "${{ env.GCR_REPO }}:${{ github.sha }}" >> $GITHUB_ENV
          else
            echo "TAGS=${{ steps.login-ecr-dev.outputs.registry }}/${{ env.ECR_REPO }}:${{ github.sha }}" >> $GITHUB_ENV
          fi

      # Build and Push
      - name: Build and Push Images
        uses: docker/build-push-action@v2
        with:
          context: .
          file: br/Dockerfile.cd
          platforms: "linux/amd64,linux/arm64"
          push: true
          tags: ${{ env.TAGS }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      # Buildx's cache-to currently only work with empty directory, here is a temp workaround.
      # https://github.com/docker/build-push-action/issues/252
      # https://github.com/moby/buildkit/issues/1896
      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

  build-arm64:
    name: Build ARM64 Image
    runs-on: arm64
    steps:
      - name: Build and Push Images
        uses: docker/build-push-action@v2
        with:
          context: .
          platforms: "linux/arm64"
          file: br/Dockerfile
          push: true
          secrets: |
            GIT_AUTH_TOKEN=${{ secrets.GIT_ACTION_BOT }}
          build-args: |
            GITHUB_TOKEN=${{ secrets.GIT_ACTION_BOT }}
          tags: hub.pingcap.net/sunxiaoguang/serverless/tidb:br-${{ github.sha }}-arm64
  build-amd64:
    name: Build AMD64 Image
    runs-on: amd64
    steps:
      - name: Build and Push Images
        uses: docker/build-push-action@v2
        with:
          context: .
          platforms: "linux/amd64"
          file: br/Dockerfile
          push: true
          secrets: |
            GIT_AUTH_TOKEN=${{ secrets.GIT_ACTION_BOT }}
          build-args: |
            GITHUB_TOKEN=${{ secrets.GIT_ACTION_BOT }}
          tags: hub.pingcap.net/sunxiaoguang/serverless/tidb:br-${{ github.sha }}-amd64
  multi-arch:
    name: Create Multi-Architecture Image
    runs-on: amd64
    needs: ["build-arm64", "build-amd64"]
    steps:
      - name: create-manifest
        run: |
          docker manifest create hub.pingcap.net/sunxiaoguang/serverless/tidb:br-${{ github.sha }} \
          --amend hub.pingcap.net/sunxiaoguang/serverless/tidb:br-${{ github.sha }}-amd64 \
          --amend hub.pingcap.net/sunxiaoguang/serverless/tidb:br-${{ github.sha }}-arm64
      - name: push-manifest
        run: |
          docker manifest push hub.pingcap.net/sunxiaoguang/serverless/tidb:br-${{ github.sha }}
